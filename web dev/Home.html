<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Book Store</title>
</head>


<!-- Frameset with rows for top and bottom sections -->
<frameset rows="190, *" frameborder="1" border="3">
    <!-- Top Frame: Header (Logo, Navigation) -->
    <frame src="top.html" name="topframe" scrolling="no" noresize title="Header Frame: Online Book Store Navigation">

    <!-- Main Content Frameset (Left and Right) -->
    <frameset cols="200, *" frameborder="1" border="3">
        <!-- Left Frame: Navigation Menu -->
        <frame src="left.html" name="leftframe" scrolling="auto" title="Navigation Frame: Book Categories">

        <!-- Right Frame: Displaying Content -->
        <frame src="right.html" name="rightframe" scrolling="auto" title="Content Frame: Book Store Introduction">
    </frameset>
</frameset>


</html>
