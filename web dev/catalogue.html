<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogue</title>
</head>
<body bgcolor="lightgreen" align="center">

    <h1 style="font-family: 'Arial', sans-serif; color: darkgreen; font-size: 50px; text-shadow: 3px 3px 5px gray; margin-top: 50px;">Book Catalogue</h1>

    <table cellpadding="15" cellspacing="10" style="margin-top: 30px; background-color: white; border-radius: 10px; box-shadow: 5px 5px 20px gray;">
        <tr>
            <td style="width: 200px; background-color: lightyellow; padding: 10px; text-align: center; border-radius: 10px;">
                <img src="https://via.placeholder.com/200" alt="Book 1" style="width: 100%; border-radius: 10px;"><br>
                <p style="color: darkblue; font-size: 20px; font-weight: bold;">Book Title 1</p>
                <p style="color: darkgreen;">$25.99</p>
                <button style="padding: 10px 20px; background-color: darkgreen; color: white; border: none; cursor: pointer; border-radius: 5px;">Add to Cart</button>
            </td>
            <td style="width: 200px; background-color: lightyellow; padding: 10px; text-align: center; border-radius: 10px;">
                <img src="https://via.placeholder.com/200" alt="Book 2" style="width: 100%; border-radius: 10px;"><br>
                <p style="color: darkblue; font-size: 20px; font-weight: bold;">Book Title 2</p>
                <p style="color: darkgreen;">$19.99</p>
                <button style="padding: 10px 20px; background-color: darkgreen; color: white; border: none; cursor: pointer; border-radius: 5px;">Add to Cart</button>
            </td>
            <td style="width: 200px; background-color: lightyellow; padding: 10px; text-align: center; border-radius: 10px;">
                <img src="https://via.placeholder.com/200" alt="Book 3" style="width: 100%; border-radius: 10px;"><br>
                <p style="color: darkblue; font-size: 20px; font-weight: bold;">Book Title 3</p>
                <p style="color: darkgreen;">$29.99</p>
                <button style="padding: 10px 20px; background-color: darkgreen; color: white; border: none; cursor: pointer; border-radius: 5px;">Add to Cart</button>
            </td>
        </tr>
        <!-- Add more books if necessary -->
    </table>

</body>
</html>
